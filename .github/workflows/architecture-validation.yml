name: Architecture Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  architecture-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate architecture
        run: node scripts/validate_architecture.mjs --root .

      - name: Run validator self-test
        run: node scripts/test_architecture_validator.mjs

      - name: Validate Universal Wallpaper batch records
        run: node scripts/validate_universal_batch_records.mjs --root .

      - name: Run Universal Wallpaper batch validator self-test
        run: node scripts/test_universal_batch_validator.mjs

      - name: Run Universal Wallpaper concurrency self-test
        run: node scripts/test_universal_concurrency.mjs

      - name: Run Universal Wallpaper Worker Pool self-test
        run: node scripts/test_universal_worker_pool.mjs

      - name: Run cross-module runtime self-test
        run: node scripts/test_cross_module_runtime.mjs

      - name: Run Runtime Verification harness
        run: node scripts/test_runtime_verification.mjs

      - name: Run executable Worker Runtime control-plane probe
        run: node scripts/test_production_runtime.mjs

      - name: Run Worker Runtime GitHub CAS probe
        run: node scripts/test_runtime_github_cas.mjs

      - name: Run Worker Runtime canonical context gate probe
        run: node scripts/test_runtime_context_gates.mjs

      - name: Run Worker Runtime execution CAS probe
        run: node scripts/test_runtime_execution_cas.mjs

      - name: Run canonical context resolver self-test
        run: node scripts/test_canonical_context_resolver.mjs

      - name: Run Worker Runtime canonical context resolver probe
        run: node scripts/test_runtime_canonical_context.mjs

      - name: Run Runtime Verification Phase-7 single-worker E2E
        run: node scripts/test_phase7_single_worker_e2e.mjs

      - name: Run Runtime Verification Phase-8 batch continuation
        run: node scripts/test_phase8_batch_continuation.mjs

      - name: Run Runtime Verification Phase-9 worker-pool CAS
        run: node scripts/test_phase9_worker_pool.mjs

      - name: Run Runtime Verification Phase-10 provider adapter boundary
        run: node scripts/test_phase10_provider_adapter_boundary.mjs

      - name: Run Runtime Verification Phase-12 provider activation gate
        run: node scripts/test_phase12_provider_activation_gate.mjs

      - name: Run Runtime Verification Phase-12 provider activation integration
        run: node scripts/test_phase12_provider_activation_integration.mjs

      - name: Run Runtime Verification Phase-13 execution context lock
        run: node scripts/test_phase13_execution_context_lock.mjs
      - name: Run Runtime Verification Phase-14 visual design adherence gate
        run: node scripts/test_phase14_visual_design_adherence.mjs

      - name: Run Runtime Verification Phase-15 automated Universal Wallpaper gate binding
        run: node scripts/test_phase15_universal_wallpaper_gate_binding.mjs
      - name: Run Runtime Verification Phase-16 automatic authoritative batch continuation
        run: node scripts/test_phase16_automatic_batch_continuation.mjs
      - name: Run Runtime Verification Phase-17 automated production controller E2E
        run: node scripts/test_phase17_automatic_production_controller_e2e.mjs
      - name: Run Runtime Verification Phase-18 failure UNKNOWN STOP safety
        run: node scripts/test_phase18_failure_unknown_stop_e2e.mjs
      - name: Run Runtime Verification Phase-19 retry and three-failure recovery E2E
        run: node scripts/test_phase19_retry_and_three_failure_e2e.mjs
      - name: Run Runtime Verification Phase-20 Claim CAS concurrency
        run: node scripts/test_phase20_claim_cas_concurrency.mjs
      - name: Run Runtime Verification Phase-21 Lease expiry recovery
        run: node scripts/test_phase21_lease_expiry_recovery.mjs
      - name: Run Runtime Verification Phase-22 full production runtime E2E
        run: node scripts/test_phase22_full_production_runtime_e2e.mjs
